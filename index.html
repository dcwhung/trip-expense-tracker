<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Spend</title>
<meta name="description" content="Offline trip expense tracker">
<meta name="theme-color" content="#0F3D2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trip Spend">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="banner" class="banner" hidden>
  <div class="banner-text">今日未備份 — 唔好賭</div>
  <button id="banner-backup" class="banner-btn" type="button">複製全部</button>
  <button id="banner-close" class="banner-x" type="button" aria-label="關閉">&times;</button>
</div>

<main>

  <!-- ───────────── 入數 ───────────── -->
  <section id="view-add" class="view">
    <h1 class="screen-title">入數</h1>

    <form id="entry-form" novalidate>
      <label class="field amount-field">
        <span class="label">金額</span>
        <div class="amount-row">
          <span class="cur" id="cur-symbol">€</span>
          <input id="amount" type="text" inputmode="decimal" autocomplete="off"
                 autocorrect="off" spellcheck="false" placeholder="0.00">
        </div>
      </label>

      <div class="field">
        <span class="label">Category</span>
        <div id="cat-grid" class="grid grid-3"></div>
      </div>

      <div class="field">
        <span class="label">Account</span>
        <div id="acct-grid" class="grid grid-2 seg"></div>
      </div>

      <div class="field">
        <span class="label">Payment</span>
        <div id="pay-grid" class="grid grid-3 seg"></div>
      </div>

      <label class="field">
        <span class="label">日期</span>
        <input id="date" type="date">
      </label>

      <label class="field">
        <span class="label">Description <em>可留空</em></span>
        <input id="description" type="text" autocomplete="off" placeholder="商戶名（刷卡可留空，事後由月結單補）">
      </label>

      <label class="field">
        <span class="label">Remarks <em>可留空</em></span>
        <textarea id="remarks" rows="2" placeholder="備註"></textarea>
      </label>

      <div class="actions">
        <button id="submit-btn" class="btn btn-primary" type="submit">儲存</button>
        <button id="delete-btn" class="btn btn-danger" type="button" hidden>刪除</button>
        <button id="cancel-btn" class="btn btn-ghost" type="button" hidden>取消</button>
      </div>
    </form>
  </section>

  <!-- ───────────── 紀錄 ───────────── -->
  <section id="view-list" class="view" hidden>
    <h1 class="screen-title">紀錄</h1>
    <div class="summary">
      <div class="summary-total" id="sum-total">€0.00</div>
      <div class="summary-meta" id="sum-meta">0 筆</div>
      <div class="summary-day" id="sum-day"></div>
    </div>
    <div id="list"></div>
  </section>

  <!-- ───────────── 匯出 ───────────── -->
  <section id="view-export" class="view" hidden>
    <h1 class="screen-title">匯出</h1>

    <div class="card">
      <div class="card-title">匯出</div>
      <button class="btn btn-primary block" type="button" data-export="csv">CSV（Excel / Numbers）</button>
      <button class="btn block" type="button" data-export="json">JSON 完整備份</button>
      <button class="btn block" type="button" data-export="text">複製純文字摘要</button>
      <p class="hint">CSV 欄位：Account, Date, Payment, Description, <span class="cur-code">EUR</span>, Category, Remarks — UTF-8 BOM，日期 ISO。</p>
    </div>

    <div class="card">
      <div class="card-title">備份</div>
      <div class="backup-state" id="backup-state">未備份過</div>
      <button class="btn btn-primary block" type="button" id="backup-now">複製全部 JSON 落剪貼簿</button>
      <p class="hint">貼落 Apple Notes 或者 send 俾自己。資料淨係喺呢部電話。</p>
    </div>

    <div class="card">
      <div class="card-title">還原</div>
      <textarea id="import-box" rows="3" placeholder="貼返之前備份嘅 JSON 落嚟"></textarea>
      <button class="btn block" type="button" id="import-btn">Import JSON（覆蓋全部）</button>
    </div>

    <div class="card danger-card">
      <div class="card-title">危險區</div>
      <p class="hint">打 <code>DELETE</code> 落去先按到。無得 undo。</p>
      <input id="wipe-confirm" type="text" autocomplete="off" autocapitalize="characters" placeholder="DELETE">
      <button class="btn btn-danger block" type="button" id="wipe-btn" disabled>清除所有資料</button>
    </div>

    <p class="version">Trip Spend · <span id="trip-label"></span></p>
  </section>

</main>

<nav class="tabbar">
  <button class="tab" type="button" data-view="add"><span>＋</span>入數</button>
  <button class="tab" type="button" data-view="list"><span>≡</span>紀錄</button>
  <button class="tab" type="button" data-view="export"><span>↥</span>匯出</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <strong id="sheet-title">全文</strong>
      <button id="sheet-close" class="btn btn-ghost" type="button">閂</button>
    </div>
    <p class="hint">長按揀全部 → 複製，或者用上面個掣。</p>
    <button id="sheet-copy" class="btn btn-primary block" type="button">複製全文</button>
    <textarea id="sheet-text" readonly></textarea>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
